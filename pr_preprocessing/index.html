<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог товарів</title>
    <link rel="stylesheet" href="style-scss.css" />
  </head>
  <body>
    <div class="container">
      <h1>Каталог товарів</h1>

      <div class="catalog">
        <article class="card">
          <h2>Телефон</h2>
          <p>Опис телефону</p>
          <span class="price">1000 ₴</span>
          <button class="btn">Купити</button>
        </article>

        <article class="card">
          <h2>Планшет</h2>
          <p>Опис планшета</p>
          <span class="price">2000 ₴</span>
          <button class="btn">Купити</button>
        </article>

        <article class="card">
          <h2>Ноутбук</h2>
          <p>Опис ноутбука</p>
          <span class="price">3000 ₴</span>
          <button class="btn">Купити</button>
        </article>
      </div>
    </div>
  </body>
</html>
